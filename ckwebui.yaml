# Zero Mining - ckwebui configuration
# This file is auto-generated by zeromining-setup from zero.yaml + nodes.yaml
# It is read at startup by server.js to configure the dashboard.
# Each entry below corresponds to one active mining pool.
#
# Fields:
#   node      - Coin ticker (uppercase)     e.g. BTC
#   name      - Full coin name              e.g. Bitcoin
#   algo      - Mining algorithm            e.g. sha256d
#   host      - Docker host IP              e.g. 192.168.1.10
#   port_web  - Pool web / API port         = zero.yaml web + node id
#   port_low  - Stratum low-diff port       = zero.yaml low + node id
#   port_hgh  - Stratum high-diff port      = zero.yaml hgh + node id
#   port_rpc  - Node RPC port               = zero.yaml rpc + node id
#   diff_low  - Starting low difficulty
#   diff_hgh  - Starting high difficulty
#   rpc_user  - RPC username (server-side only, never sent to browser)
#   rpc_pass  - RPC password (server-side only, never sent to browser)
#   image_node- Docker node image name      e.g. node-btc
#   image_pool- Docker pool image name      e.g. pool-btc
#   blocks_file- Path to persisted blocks yaml

# ── Entries are appended here by zeromining-setup ──
